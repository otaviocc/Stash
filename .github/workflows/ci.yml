name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'Docs/**'
      - '**/*.md'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The published image is built with swift:6.1-jammy, so test the backend
      # on the same toolchain it ships with. (Swift 6.2.1's release optimizer
      # crashes compiling the Vapor dependency tree; see DECISIONS.md M4.1.)
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      # Run serially: each test boots its own app and hashes with bcrypt cost 12,
      # and parallel execution starves the SQLite connection pool on a CI runner
      # (connectionRequestTimeout). See DECISIONS.md M4.1.
      - name: Test backend
        run: cd Backend && swift test --no-parallel

  linux-cli:
    name: StashKit & CLI (Linux)
    # MicroClient 0.0.28+ ships the FoundationNetworking shim, so StashKit and the CLI
    # build and test natively here instead of only on the macOS runner below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Test StashKit
        run: cd StashKit && swift test

      - name: Build CLI
        run: cd CLI && swift build -c release

  apple:
    name: StashKit, CLI & App
    # The Apple-only pieces run on one macOS runner: the app/extension are Xcode-only
    # and target iOS 26 / macOS 26, so they need Xcode 26. StashKit and the CLI build
    # here too, as a regression check for the Apple platforms specifically, alongside
    # the Linux build above. One runner keeps macOS minutes (billed ~10x) down.
    #
    # Pinned to macos-26 (not macos-latest, which still maps to macOS 15): the
    # Icon Composer AppIcon.icon is compiled by actool via the AssetCatalogAgent
    # rendering helper, and that helper crashes at launch on some macos-15 image
    # patches due to a broken MediaToolbox/AVFCore dyld state ("AssetCatalogAgent
    # closed the connection"). macOS 26 is the app's actual target OS and avoids
    # that environment. Hosted runners can't pin an exact image patch, so this OS
    # label is the strongest available pin.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build StashKit
        run: cd StashKit && swift build

      - name: Test StashKit
        run: cd StashKit && swift test

      - name: Build CLI
        run: cd CLI && swift build -c release

      # The app has no unit tests by design (Docs/product-technical.md §19.6); building both
      # platforms (which also compiles the embedded Share Extension) is the regression check.
      # A generic destination avoids depending on a specific simulator.
      - name: Build app (iOS)
        run: cd StashApp && xcodebuild -scheme Stash -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

      - name: Build app (macOS)
        run: cd StashApp && xcodebuild -scheme Stash -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO

  extension:
    name: Extension
    # The browser extension has no compile step; it is validated, not built.
    # `make lint` runs dependency-free checks (manifest is valid JSON; the JS
    # passes `node --check`) since the project deliberately ships no npm/web-ext
    # toolchain. python3 and node are both preinstalled on the ubuntu runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension
        run: cd Extension && make lint
