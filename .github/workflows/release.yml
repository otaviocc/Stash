name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      # Serially, for the same reason as ci.yml: parallel execution starves the
      # SQLite connection pool on a CI runner (connectionRequestTimeout). See
      # DECISIONS.md M4.1.
      - name: Run backend tests
        run: cd Backend && swift test --no-parallel

  # Built natively per-arch rather than cross-compiled under QEMU: emulating a
  # full Vapor/NIO release build (~1300 files) crashed the Swift compiler
  # itself under arm64 emulation (swift-runtime "failed to suspend thread",
  # Signal 5) after 10+ minutes, on top of earlier QEMU/binfmt segfaults in
  # apt's libc-bin trigger (docker/setup-qemu-action#199). GitHub's hosted
  # ubuntu-24.04-arm runners make native arm64 builds straightforward instead.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/otaviocc/stash,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [test, build]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/otaviocc/stash:latest \
            -t ghcr.io/otaviocc/stash:${{ steps.version.outputs.version }} \
            $(printf 'ghcr.io/otaviocc/stash@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/otaviocc/stash:${{ steps.version.outputs.version }}

      # NOTE: Container package visibility is NOT settable from CI. There is no
      # REST endpoint for it, and GITHUB_TOKEN (a bot installation token) cannot
      # call the user-scoped package API. After the first push, set the package
      # public ONCE by hand: GitHub → Packages → stash → Package settings →
      # Danger Zone → Change visibility → Public. It then stays public across
      # all subsequent pushes.

      # The extension has no build step; "package" just zips the runtime files
      # into Extension/dist/ (named from its own manifest version, independent of
      # the image tag). Attached to the release so users can sideload it.
      - name: Package browser extension
        run: cd Extension && make package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stash ${{ github.ref_name }}
          body: |
            ## Stash ${{ github.ref_name }}

            ### Quick start

            1. Download `docker-compose.yml` below
            2. Create a `.env` file with `DB_PASSWORD`, `JWT_SECRET`,
               `ADMIN_USERNAME`, and `ADMIN_PASSWORD` (see
               [Running with Docker](https://github.com/otaviocc/Stash/blob/main/Docs/backend-docker.md))
            3. Run `docker compose up -d`
            4. Open `http://localhost:8080/app` and sign in with your admin credentials

            The image is available at `ghcr.io/otaviocc/stash:${{ steps.version.outputs.version }}`

            ### Browser extension

            The `stash-extension-*.zip` below is the Firefox/Chrome extension,
            sideload it via developer mode, or see
            [Browser extension](https://github.com/otaviocc/Stash/blob/main/Docs/browser-extension.md).
          files: |
            Backend/docker-compose.yml
            Extension/dist/*.zip
          draft: false
          prerelease: false
